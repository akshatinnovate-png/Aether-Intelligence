<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
<title>Aether</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: grid; place-items: center; background: #0a0a0b; color: #ecece8; font: 14px/1.5 -apple-system, 'Segoe UI', Inter, system-ui, sans-serif; -webkit-app-region: drag; }
  .card { width: min(440px, 90vw); -webkit-app-region: no-drag; }
  .mark { width: 40px; height: 40px; display: grid; place-items: center; background: #d4ff3a; color: #0a0a0b; font: 600 20px/1 Georgia, serif; border-radius: 2px; }
  .eyebrow { font: 500 10.5px/1 ui-monospace, Menlo, monospace; letter-spacing: .14em; text-transform: uppercase; color: #84847e; margin: 28px 0 10px; }
  h1 { font: 400 32px/1.15 Georgia, 'Times New Roman', serif; margin: 0 0 10px; letter-spacing: -.01em; }
  p { color: #b4b4ae; margin: 0 0 22px; }
  input { width: 100%; height: 40px; padding: 0 12px; background: #131315; border: 1px solid #2e2e33; color: #ecece8; border-radius: 2px; font: 13px ui-monospace, Menlo, monospace; outline: none; }
  input:focus { border-color: rgba(212,255,58,.5); box-shadow: 0 0 0 3px rgba(212,255,58,.1); }
  button { margin-top: 12px; width: 100%; height: 40px; border: 0; background: #d4ff3a; color: #0a0a0b; font-weight: 600; border-radius: 2px; cursor: pointer; }
  button:disabled { opacity: .5; }
  .err { color: #ff6b5e; font-size: 12.5px; margin-top: 10px; min-height: 18px; }
  .hint { color: #5c5c58; font-size: 12px; margin-top: 18px; }
</style>
</head>
<body>
  <form class="card" id="f">
    <div class="mark">Æ</div>
    <div class="eyebrow">Aether for desktop</div>
    <h1>Connect to your lab</h1>
    <p>Enter the address of your Aether workspace — the URL your team uses in the browser.</p>
    <input id="u" placeholder="aether.your-name.workers.dev" autofocus spellcheck="false" autocomplete="url" />
    <button id="b">Connect</button>
    <div class="err" id="e"></div>
    <div class="hint">You can change it later from the tray icon or File → Change workspace.</div>
  </form>
  <script>
    const f = document.getElementById('f'), u = document.getElementById('u'), b = document.getElementById('b'), e = document.getElementById('e');
    f.addEventListener('submit', async (ev) => {
      ev.preventDefault();
      if (!u.value.trim()) return;
      b.disabled = true; b.textContent = 'Checking…'; e.textContent = '';
      const r = await window.aetherDesktop.setWorkspace(u.value.trim());
      if (!r.ok) { e.textContent = r.error; b.disabled = false; b.textContent = 'Connect'; }
    });
  </script>
</body>
</html>
