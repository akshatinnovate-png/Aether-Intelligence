<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
<title>Aether — offline</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; height: 100vh; display: grid; place-items: center; background: #0a0a0b; color: #ecece8; font: 14px/1.5 -apple-system, 'Segoe UI', Inter, system-ui, sans-serif; }
  .card { width: min(440px, 90vw); }
  h1 { font: 400 28px/1.2 Georgia, serif; margin: 0 0 10px; }
  p { color: #b4b4ae; }
  code { color: #84847e; font-size: 12px; word-break: break-all; }
  button { height: 38px; padding: 0 18px; border: 0; background: #d4ff3a; color: #0a0a0b; font-weight: 600; border-radius: 2px; cursor: pointer; }
</style>
</head>
<body>
  <div class="card">
    <h1>Can’t reach your workspace</h1>
    <p>Check your internet connection. Aether will retry automatically every 15 seconds.</p>
    <p><code id="r"></code></p>
    <button onclick="window.aetherDesktop.retry()">Retry now</button>
  </div>
  <script>
    const q = new URLSearchParams(location.search);
    document.getElementById('r').textContent = (q.get('reason') || '') + ' ' + (q.get('url') || '');
    setInterval(() => navigator.onLine && window.aetherDesktop.retry(), 15000);
  </script>
</body>
</html>
