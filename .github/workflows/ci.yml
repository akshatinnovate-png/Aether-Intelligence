name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright@1.63.0 install --with-deps chromium
      - name: Start the Worker locally (Miniflare + local D1)
        run: |
          npx wrangler d1 migrations apply aether-db --local
          npx wrangler dev --port 8787 > wrangler.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8787/api/health && break; sleep 1; done
      - name: End-to-end test
        run: npm i --no-save playwright@1.63.0 && node test/e2e.mjs http://localhost:8787 screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots
