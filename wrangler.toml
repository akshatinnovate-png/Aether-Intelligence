# AETHER — Cloudflare Worker serving the API, realtime hub and the web app from one origin.
name = "aether"
main = "worker/src/index.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
directory = "./web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "aether-db"
# Replaced automatically by the deploy workflow (scripts/deploy.mjs). For local dev any value works.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "worker/migrations"

[[durable_objects.bindings]]
name = "HUB"
class_name = "Hub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Hub"]

[triggers]
crons = ["17 * * * *"]

[observability]
enabled = true
